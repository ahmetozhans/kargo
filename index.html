<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#f7f9fc" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Kargo" />
  <title>Kargo · Hızlı Dağıtım</title>
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="icon" href="./icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="./icon.svg" />
  <link rel="preconnect" href="https://unpkg.com" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="" />
  <link rel="stylesheet" href="./styles.css" />
  <link rel="stylesheet" href="./fast.css" />
  <link rel="stylesheet" href="./search.css" />
  <link rel="stylesheet" href="./map-shell.css" />
</head>
<body class="map-app">
  <main class="map-shell">
    <section class="map-stage" aria-label="Dağıtım haritası">
      <div id="map"></div>

      <button type="button" class="map-float menu-float" id="menuBtn" aria-label="Menü">
        <span></span><span></span><span></span>
      </button>

      <div class="map-right-tools">
        <button type="button" class="map-float" id="layerBtn" aria-label="Harita katmanı">◇</button>
        <button type="button" class="map-float locate-float" id="locateBtn" aria-label="Konumumu bul">◎</button>
      </div>

      <div class="map-status map-status-float" id="mapStatus">Durak ekleyerek rotanı oluştur.</div>

      <div class="mini-menu" id="miniMenu" hidden>
        <button type="button" id="menuLocateBtn">◎ Konumuma git</button>
        <button type="button" id="menuOptimizeBtn">⇅ Rotayı sırala</button>
        <button type="button" id="menuClearBtn">✓ Bitenleri temizle</button>
      </div>
    </section>

    <section class="route-sheet sheet-mid" id="routeSheet" aria-label="Rota paneli">
      <button type="button" class="route-sheet-handle" id="sheetHandle" aria-label="Paneli büyüt veya küçült">
        <span></span>
      </button>

      <div class="sheet-scroll" id="sheetScroll">
        <form class="quick-add map-search" id="quickAddForm">
          <span class="search-icon" aria-hidden="true">⌕</span>
          <input id="quickAddressInput" autocomplete="off" enterkeyhint="search" placeholder="Firma adı veya Bursa adresi" aria-label="Firma veya adres ara" />
          <button type="button" class="quick-paste scan-like" id="quickPasteBtn" aria-label="Panodan yapıştır">▧</button>
          <button type="submit" class="quick-submit search-submit" id="quickAddBtn">Ara</button>
        </form>
        <div id="searchResults" class="search-results sheet-search-results" hidden aria-live="polite"></div>

        <section class="summary compact-summary" aria-label="Rota özeti">
          <div class="metric">
            <span class="metric-value" id="stopCount">0</span>
            <span class="metric-label">Kalan</span>
          </div>
          <div class="metric">
            <span class="metric-value" id="distanceValue">—</span>
            <span class="metric-label">Mesafe</span>
          </div>
          <div class="metric">
            <span class="metric-value" id="durationValue">—</span>
            <span class="metric-label">Tahmini</span>
          </div>
        </section>

        <section id="nextStopCard" class="next-stop sheet-next-stop" hidden aria-live="polite">
          <div class="next-stop-head">
            <div>
              <p class="eyebrow">SIRADAKİ DURAK</p>
              <h2 id="nextRecipient">—</h2>
            </div>
            <span class="next-badge" id="nextBadge">1</span>
          </div>
          <p class="next-address" id="nextAddress"></p>
          <p class="next-note" id="nextNote" hidden></p>
          <div class="next-actions">
            <button type="button" class="next-action primary" id="nextNavigateBtn">Git →</button>
            <button type="button" class="next-action success" id="nextDoneBtn">✓ Teslim</button>
            <button type="button" class="next-action" id="nextFailedBtn">Olmadı</button>
            <button type="button" class="next-action" id="nextCallBtn" hidden>Ara</button>
          </div>
        </section>

        <div id="emptyState" class="sheet-empty-state">
          <div class="empty-pin" aria-hidden="true">⌖</div>
          <p>Rotanı oluşturmaya başlamak için ilk durağını ekle</p>
          <button class="sheet-main-add" id="addStopBtn" type="button"><span>＋</span> Durak ekle</button>
          <button class="sheet-copy-route" id="copyRouteBtn" type="button">Eski bir rotadaki durakları kopyala</button>
        </div>

        <section class="panel sheet-stop-panel">
          <div class="panel-heading">
            <div>
              <p class="eyebrow">DURAKLAR</p>
              <h2>Dağıtım listesi</h2>
            </div>
            <button class="text-button" id="clearDoneBtn">Bitenleri temizle</button>
          </div>
          <ol id="stopList" class="stop-list" aria-live="polite"></ol>
        </section>

        <div class="bottom-actions sheet-route-actions">
          <button class="secondary-button" id="optimizeBtn" disabled><span>⇅</span> Sırala</button>
          <button class="primary-button" id="startRouteBtn" disabled>Sıradaki durağa git <span>→</span></button>
        </div>
      </div>
    </section>
  </main>

  <dialog id="stopDialog" class="sheet-dialog">
    <form id="stopForm" method="dialog" class="sheet">
      <div class="sheet-handle"></div>
      <div class="sheet-header">
        <div>
          <p class="eyebrow">DETAYLI EKLE</p>
          <h2>Teslimat ekle</h2>
        </div>
        <button type="button" class="icon-button small" id="closeDialogBtn" aria-label="Kapat">×</button>
      </div>
      <label>
        <span>Firma / adres *</span>
        <textarea id="addressInput" rows="3" autocomplete="street-address" placeholder="Firma adı veya Bursa adresi" required></textarea>
      </label>
      <div class="form-grid">
        <label><span>Alıcı</span><input id="recipientInput" autocomplete="name" placeholder="Ad soyad" /></label>
        <label><span>Telefon</span><input id="phoneInput" type="tel" autocomplete="tel" inputmode="tel" placeholder="05xx ..." /></label>
      </div>
      <label><span>Not</span><input id="noteInput" placeholder="Kapı kodu, kat, teslimat notu..." /></label>
      <div id="formMessage" class="form-message" role="status"></div>
      <button class="primary-button full" id="saveStopBtn" type="submit">Bursa'da bul ve ekle</button>
      <button class="ghost-button full" id="useMapPointBtn" type="button">Haritadan nokta seç</button>
    </form>
  </dialog>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin="" defer></script>
  <script src="./app.js" defer></script>
  <script src="./search.js" defer></script>
  <script src="./map-shell.js" defer></script>
</body>
</html>
